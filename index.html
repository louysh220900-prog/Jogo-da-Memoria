<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo da Memória — Fase 1 Halloween</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--purple:#251344;--orange:#ff8a24;--lavender:#d9c5ff}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 76% 8%,#ffb43d 0, #7a3b70 9%,transparent 24%),radial-gradient(ellipse at 10% 30%,#3f2b77 0,transparent 38%),linear-gradient(145deg,#09081f,#1a1038 55%,#090819);color:#fff4df;font-family:system-ui,Arial,sans-serif;overflow-x:hidden;position:relative}
body:before,body:after{position:fixed;z-index:0;pointer-events:none;font-size:clamp(4rem,10vw,8rem);opacity:.78;filter:drop-shadow(0 0 18px #ff6a20)}
body:before{content:"🎃";left:2vw;bottom:1vh;transform:rotate(-12deg)}
body:after{content:"🦇";right:3vw;top:3vh;transform:rotate(12deg)}
main{position:relative;z-index:1;width:min(100%,480px);text-align:center;padding:28px 22px 24px;border:1px solid #a77bce80;border-radius:26px;background:linear-gradient(160deg,#17102deF,#24133beF);box-shadow:0 20px 70px #0009,0 0 35px #9b54c455;backdrop-filter:blur(5px)}
.tag{display:inline-block;background:#ff8a24;color:#28123b;padding:7px 14px;border-radius:20px;font-weight:900;letter-spacing:1.5px;font-size:.78rem;box-shadow:0 0 20px #ff8a2460}
h1{margin:17px 0 6px;font-size:clamp(1.7rem,6vw,2.25rem);text-shadow:0 0 22px #ff8a2460}p{color:#d9c5ff;margin-top:8px}
.stats{display:flex;justify-content:center;gap:9px;margin:20px 0}.stat{flex:1;background:#ffffff0d;border:1px solid #b99be544;border-radius:14px;padding:11px 6px}.stat strong{display:block;font-size:1.35rem;color:#ffb15c}.stat span{font-size:.8rem;color:#d9c5ff}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.card{aspect-ratio:1;border:1px solid #c8a8ff80;border-radius:15px;background:linear-gradient(145deg,#7544a6,#39215f);color:white;font-size:clamp(1.5rem,7vw,2.25rem);cursor:pointer;box-shadow:0 5px 0 #160c2c,0 0 15px #8d4fd522;transition:transform .16s,filter .16s,border-color .16s}
.card:hover{transform:translateY(-3px);filter:brightness(1.2);border-color:#ffb15c}.card.open,.card.matched{background:linear-gradient(145deg,#fff0d2,#e7d4ff);color:#28123b;box-shadow:0 4px 0 #a58ac4}.card.matched{outline:2px solid #8fe0a2}
#message{min-height:44px;font-weight:700;margin:19px 0 12px;color:#ffce91;line-height:1.45}
button.action{border:0;border-radius:25px;padding:12px 17px;margin:4px;background:linear-gradient(135deg,#ff9b35,#ff6a24);color:#28123b;font-size:.95rem;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #a83b18;transition:transform .15s}button.action:hover{transform:translateY(-2px)}button.secondary{background:#3d2b5e!important;color:#fff4df!important;box-shadow:0 4px 0 #17102b!important;border:1px solid #ad8bd8}
@media(max-width:360px){main{padding:22px 14px}.board{gap:7px}.stats{gap:5px}.card{border-radius:11px}}
</style></head>
<body><main>
<span class="tag">🎃 FASE 1 · FÁCIL 🎃</span><h1>🧠 Jogo da Memória</h1><p>Encontre os 4 pares de animais!</p>
<div class="stats"><div class="stat"><strong id="pairs">0/4</strong><span>Pares</span></div><div class="stat"><strong id="moves">0</strong><span>Jogadas</span></div><div class="stat"><strong id="time">0:00</strong><span>Tempo</span></div></div>
<div class="board" id="board"></div><div id="message" role="status">Toque em duas cartas para começar.</div>
<button class="action" id="restart">🔄 Reiniciar fase</button><button class="action secondary" id="rules">Como jogar?</button>
</main>
<script>
const animals=["🐶","🐱","🐸","🦊"];const board=document.querySelector("#board");let first=null,locked=false,pairs=0,moves=0,seconds=0,timer=null,started=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){clearInterval(timer);first=null;locked=false;pairs=0;moves=0;seconds=0;started=false;document.querySelector("#pairs").textContent="0/4";document.querySelector("#moves").textContent="0";document.querySelector("#time").textContent="0:00";document.querySelector("#message").textContent="Toque em duas cartas para começar.";board.innerHTML="";shuffle([...animals,...animals]).forEach(a=>{let b=document.createElement("button");b.className="card";b.textContent="❔";b.dataset.animal=a;b.setAttribute("aria-label","Carta fechada");b.addEventListener("click",()=>flip(b));board.appendChild(b)})}
function flip(c){if(locked||c.classList.contains("open")||c.classList.contains("matched"))return;if(!started){started=true;timer=setInterval(()=>{seconds++;document.querySelector("#time").textContent=Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0")},1000)}c.classList.add("open");c.textContent=c.dataset.animal;if(!first){first=c;return}moves++;document.querySelector("#moves").textContent=moves;if(first.dataset.animal===c.dataset.animal){first.classList.replace("open","matched");c.classList.replace("open","matched");first.disabled=true;c.disabled=true;first=null;pairs++;document.querySelector("#pairs").textContent=pairs+"/4";if(pairs===4){clearInterval(timer);document.querySelector("#message").textContent="🎉 Você venceu a Fase 1! Feliz Halloween! 🎃"}else document.querySelector("#message").textContent="Acertou! Procure o próximo par."}else{locked=true;let prev=first;first=null;document.querySelector("#message").textContent="Não combinou! Tente novamente.";setTimeout(()=>{prev.classList.remove("open");c.classList.remove("open");prev.textContent="❔";c.textContent="❔";locked=false},850)}}
document.querySelector("#restart").addEventListener("click",start);document.querySelector("#rules").addEventListener("click",()=>document.querySelector("#message").textContent="Vire duas cartas por vez. Os pares iguais ficam abertos. Encontre os 4 pares para vencer!");start();
</script></body></html>
